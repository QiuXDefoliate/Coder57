services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bank_agent
      POSTGRES_PASSWORD: bank_agent
      POSTGRES_DB: bank_agent
    ports: ["5432:5432"]
    volumes: ["bank_agent_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bank_agent_pg:
